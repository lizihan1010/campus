name: Build iPhone IPA
on:
  push:
    paths:
      - 'CampusLife-source.zip'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: unzip -q CampusLife-source.zip -d source
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and build
        run: |
          PROJECT_DIR="$(dirname "$(find source -name project.yml -print -quit)")"
          cd "$PROJECT_DIR"
          xcodegen generate
          xcodebuild -project CampusLife.xcodeproj -scheme CampusLife -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/campus-build" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/campus-build/Build/Products/Release-iphoneos/CampusLife.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/CampusLife-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CampusLife-unsigned-IPA
          path: CampusLife-unsigned.ipa
          if-no-files-found: error
